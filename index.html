<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskLoom - Smart Daily & Routine To-Do</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#4c1d95',
                        }
                    },
                    keyframes: {
                        strike: {
                            '0%': { width: '0%' },
                            '100%': { width: '100%' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(6px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    },
                    animation: {
                        strike: 'strike 0.25s ease-out forwards',
                        fadeIn: 'fadeIn 0.2s ease-out forwards'
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col selection:bg-brand-500 selection:text-white"
      x-data="todoApp()" 
      x-init="initApp()">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 px-4 lg:px-8 py-3 transition-colors">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
            <!-- App Logo -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <i data-lucide="check-square" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">
                        TaskLoom
                    </h1>
                    <p class="text-xs text-slate-400">Simple & Powerful To-Do</p>
                </div>
            </div>

            <!-- Action Tabs / Header Buttons -->
            <div class="flex items-center gap-2">
                <button @click="activeModal = 'routines'" 
                        class="px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/50 text-slate-200 text-xs sm:text-sm font-medium flex items-center gap-1.5 transition-all hover:border-brand-500/50 active:scale-95">
                    <i data-lucide="sparkles" class="w-4 h-4 text-brand-400"></i>
                    <span>定番To-Do</span>
                </button>
                
                <button @click="openMonthlySummary()" 
                        class="px-3 py-1.5 rounded-lg bg-brand-600/20 hover:bg-brand-600/30 border border-brand-500/30 text-brand-300 text-xs sm:text-sm font-medium flex items-center gap-1.5 transition-all hover:border-brand-500/60 active:scale-95">
                    <i data-lucide="calendar-days" class="w-4 h-4 text-brand-400"></i>
                    <span>月別まとめ</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 flex flex-col gap-6">

        <!-- Date Header & Navigation -->
        <section class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 sm:p-5 backdrop-blur-sm shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
            
            <div class="flex items-center gap-3">
                <button @click="changeDate(-1)" 
                        class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-all active:scale-95 border border-slate-700/50"
                        title="前日">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>

                <div class="relative flex items-center gap-2">
                    <input type="date" 
                           x-model="selectedDate" 
                           @change="onDateChange()"
                           class="bg-slate-800/90 text-white font-semibold text-sm sm:text-base border border-slate-700 rounded-xl px-3 py-2 cursor-pointer focus:ring-2 focus:ring-brand-500 focus:outline-none shadow-inner">
                    
                    <button @click="setToday()" 
                            x-show="selectedDate !== todayStr"
                            class="px-2.5 py-1 text-xs font-semibold bg-brand-500/20 text-brand-300 hover:bg-brand-500/30 border border-brand-500/40 rounded-lg transition-all">
                        今日
                    </button>
                </div>

                <button @click="changeDate(1)" 
                        class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-all active:scale-95 border border-slate-700/50"
                        title="翌日">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Date Title & Progress Bar -->
            <div class="flex-1 md:max-w-xs flex flex-col gap-1.5">
                <div class="flex justify-between items-center text-xs text-slate-400 font-medium">
                    <span x-text="formattedDateDisplay"></span>
                    <span class="text-brand-400 font-semibold" x-text="`${dailyCompletionPercent}% 完了`"></span>
                </div>
                <!-- Progress bar track -->
                <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden border border-slate-700/40">
                    <div class="bg-gradient-to-r from-brand-500 to-indigo-500 h-2 rounded-full transition-all duration-500" 
                         :style="`width: ${dailyCompletionPercent}%`"></div>
                </div>
            </div>
        </section>

        <!-- Quick Routine Add Bar (定番To-Doのクイック追加) -->
        <section x-show="routines.length > 0" class="flex flex-col gap-2">
            <div class="flex items-center justify-between text-xs font-semibold text-slate-400 px-1">
                <span class="flex items-center gap-1.5">
                    <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-400"></i>
                    定番To-Doを即時追加
                </span>
                <button @click="activeModal = 'routines'" class="text-brand-400 hover:underline">編集</button>
            </div>
            
            <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
                <template x-for="routine in routines" :key="routine.id">
                    <button @click="addFromRoutine(routine)"
                            class="shrink-0 px-3 py-1.5 bg-slate-900/80 hover:bg-slate-800 border border-slate-800 hover:border-brand-500/50 rounded-xl text-xs text-slate-300 hover:text-white flex items-center gap-1.5 transition-all shadow-sm active:scale-95 group">
                        <i data-lucide="plus" class="w-3.5 h-3.5 text-brand-400 group-hover:scale-110 transition-transform"></i>
                        <span x-text="routine.title"></span>
                        <template x-if="routine.image">
                            <span class="w-2 h-2 rounded-full bg-brand-400 inline-block"></span>
                        </template>
                    </button>
                </template>
            </div>
        </section>

        <!-- Add New Task Input Card -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg focus-within:border-brand-500/60 transition-colors">
            <form @submit.prevent="addTask()" class="flex flex-col gap-3">
                <div class="flex items-center gap-3">
                    <input type="text" 
                           x-model="newTaskTitle" 
                           placeholder="新しいタスクを入力... (例: 朝のジョギング 3km)" 
                           class="flex-1 bg-transparent text-white placeholder-slate-500 text-sm sm:text-base focus:outline-none">
                    
                    <!-- Image Upload Trigger -->
                    <label class="cursor-pointer p-2 text-slate-400 hover:text-brand-400 hover:bg-slate-800 rounded-xl transition-all" title="画像を添付">
                        <i data-lucide="image" class="w-5 h-5"></i>
                        <input type="file" accept="image/*" class="hidden" @change="handleImageSelect($event)">
                    </label>

                    <!-- Submit Button -->
                    <button type="submit" 
                            :disabled="!newTaskTitle.trim() && !newTaskImage"
                            class="px-4 py-2 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-medium rounded-xl shadow-md shadow-brand-500/20 flex items-center gap-1.5 transition-all active:scale-95">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span>追加</span>
                    </button>
                </div>

                <!-- Image Preview before adding -->
                <template x-if="newTaskImage">
                    <div class="relative inline-block mt-1 w-24 h-24 rounded-xl overflow-hidden border border-slate-700 bg-slate-950 group">
                        <img :src="newTaskImage" class="w-full h-full object-cover">
                        <button type="button" 
                                @click="newTaskImage = null" 
                                class="absolute top-1 right-1 bg-slate-950/80 hover:bg-red-600 text-white p-1 rounded-lg transition-colors">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </template>
            </form>
        </section>

        <!-- Tasks Container -->
        <section class="flex flex-col gap-6">

            <!-- Active / Incomplete Tasks -->
            <div class="flex flex-col gap-3">
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-xs font-bold tracking-wider text-slate-400 uppercase flex items-center gap-2">
                        <span>未完了のタスク</span>
                        <span class="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full" x-text="activeTasks.length"></span>
                    </h2>
                </div>

                <!-- Empty State -->
                <template x-if="activeTasks.length === 0">
                    <div class="bg-slate-900/40 border border-dashed border-slate-800 rounded-2xl p-8 text-center flex flex-col items-center justify-center gap-2">
                        <div class="w-12 h-12 rounded-full bg-slate-800/80 flex items-center justify-center text-slate-500 mb-1">
                            <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                        </div>
                        <p class="text-slate-400 text-sm font-medium">未完了のタスクはありません</p>
                        <p class="text-slate-500 text-xs">新しいタスクを入力するか定番To-Doから追加しましょう！</p>
                    </div>
                </template>

                <!-- Incomplete Task Cards List -->
                <div class="space-y-2.5">
                    <template x-for="task in activeTasks" :key="task.id">
                        <div class="group bg-slate-900/90 hover:bg-slate-900 border border-slate-800/80 hover:border-slate-700 rounded-2xl p-3.5 sm:p-4 shadow-sm transition-all flex flex-col gap-3 animate-fadeIn">
                            <div class="flex items-start justify-between gap-3">
                                <div class="flex items-start gap-3 flex-1 min-w-0">
                                    <!-- Checkbox -->
                                    <button @click="toggleTask(task.id)" 
                                            class="mt-0.5 w-5 h-5 rounded-lg border-2 border-slate-600 group-hover:border-brand-400 flex items-center justify-center transition-all shrink-0">
                                    </button>
                                    
                                    <!-- Task Content -->
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm sm:text-base text-slate-100 break-words font-normal leading-relaxed" x-text="task.title"></p>
                                    </div>
                                </div>

                                <!-- Actions -->
                                <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition-opacity">
                                    <button @click="deleteTask(task.id)" 
                                            class="p-1.5 text-slate-500 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition-colors"
                                            title="削除">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Image Thumbnail (if exists) -->
                            <template x-if="task.image">
                                <div class="ml-8">
                                    <img :src="task.image" 
                                         @click="openLightbox(task.image)" 
                                         class="w-20 h-20 sm:w-24 sm:h-24 object-cover rounded-xl border border-slate-700/80 cursor-pointer hover:opacity-90 transition-opacity shadow-sm">
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Completed Tasks (消えたものは残る) -->
            <div class="flex flex-col gap-3 pt-4 border-t border-slate-800/80" x-show="completedTasks.length > 0">
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-xs font-bold tracking-wider text-slate-400 uppercase flex items-center gap-2">
                        <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
                        <span>完了したタスク (履歴)</span>
                        <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] px-2 py-0.5 rounded-full" x-text="completedTasks.length"></span>
                    </h2>
                    
                    <button @click="clearCompletedForDay()" class="text-xs text-slate-500 hover:text-red-400 transition-colors">
                        この日の完了分を全削除
                    </button>
                </div>

                <!-- Completed Task Cards List -->
                <div class="space-y-2.5">
                    <template x-for="task in completedTasks" :key="task.id">
                        <div class="group bg-slate-900/40 border border-slate-800/50 rounded-2xl p-3.5 sm:p-4 transition-all flex flex-col gap-3">
                            <div class="flex items-start justify-between gap-3">
                                <div class="flex items-start gap-3 flex-1 min-w-0">
                                    <!-- Checked Box -->
                                    <button @click="toggleTask(task.id)" 
                                            class="mt-0.5 w-5 h-5 rounded-lg bg-brand-600 border-2 border-brand-500 flex items-center justify-center transition-all shrink-0 shadow-sm shadow-brand-500/30">
                                        <i data-lucide="check" class="w-3.5 h-3.5 text-white stroke-[3]"></i>
                                    </button>
                                    
                                    <!-- Task Title with Strikethrough Animation -->
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm sm:text-base task-text-completed font-normal leading-relaxed break-words" x-text="task.title"></p>
                                    </div>
                                </div>

                                <!-- Actions -->
                                <div class="flex items-center gap-1 opacity-60 group-hover:opacity-100 transition-opacity">
                                    <button @click="deleteTask(task.id)" 
                                            class="p-1.5 text-slate-500 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition-colors"
                                            title="削除">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Image Thumbnail (Completed) -->
                            <template x-if="task.image">
                                <div class="ml-8 opacity-60 hover:opacity-100 transition-opacity">
                                    <img :src="task.image" 
                                         @click="openLightbox(task.image)" 
                                         class="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded-xl border border-slate-800 cursor-pointer shadow-sm">
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>

        </section>
    </main>

    <!-- Modal 1: 定番To-Do (Routine Templates) Modal -->
    <div x-show="activeModal === 'routines'" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md"
         style="display: none;">
        
        <div @click.away="activeModal = null" class="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl flex flex-col gap-5">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <div class="flex items-center gap-2.5">
                    <div class="p-2 rounded-xl bg-brand-500/10 text-brand-400 border border-brand-500/20">
                        <i data-lucide="sparkles" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-lg text-white">定番To-Do (ルーティン) 管理</h3>
                        <p class="text-xs text-slate-400">毎日繰り返すタスクを登録して即座に呼び出せます</p>
                    </div>
                </div>
                <button @click="activeModal = null" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- New Routine Form -->
            <form @submit.prevent="addRoutine()" class="flex flex-col gap-3">
                <div class="flex items-center gap-2">
                    <input type="text" 
                           x-model="newRoutineTitle" 
                           placeholder="定番タスク名 (例: 毎朝の水やり、ビタミン摂取)" 
                           class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    
                    <label class="cursor-pointer p-2 text-slate-400 hover:text-brand-400 hover:bg-slate-800 rounded-xl transition-all" title="参考画像を添付">
                        <i data-lucide="image" class="w-5 h-5"></i>
                        <input type="file" accept="image/*" class="hidden" @change="handleRoutineImageSelect($event)">
                    </label>

                    <button type="submit" 
                            :disabled="!newRoutineTitle.trim()"
                            class="px-4 py-2 bg-brand-600 hover:bg-brand-500 disabled:opacity-40 text-white text-sm font-medium rounded-xl transition-all">
                        登録
                    </button>
                </div>

                <!-- Image preview for routine -->
                <template x-if="newRoutineImage">
                    <div class="relative inline-block w-16 h-16 rounded-lg overflow-hidden border border-slate-700">
                        <img :src="newRoutineImage" class="w-full h-full object-cover">
                        <button type="button" @click="newRoutineImage = null" class="absolute top-0.5 right-0.5 bg-slate-900/80 p-0.5 rounded text-white">
                            <i data-lucide="x" class="w-3 h-3"></i>
                        </button>
                    </div>
                </template>
            </form>

            <!-- Routine Items List -->
            <div class="max-h-60 overflow-y-auto space-y-2 pr-1">
                <template x-if="routines.length === 0">
                    <p class="text-center text-xs text-slate-500 py-6">登録された定番To-Doはありません</p>
                </template>

                <template x-for="routine in routines" :key="routine.id">
                    <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-3 flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <template x-if="routine.image">
                                <img :src="routine.image" class="w-10 h-10 rounded-lg object-cover border border-slate-700 shrink-0">
                            </template>
                            <span class="text-sm text-slate-200 font-medium truncate" x-text="routine.title"></span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button @click="addFromRoutine(routine); activeModal = null" 
                                    class="px-2.5 py-1 bg-brand-500/20 hover:bg-brand-500/30 text-brand-300 border border-brand-500/30 rounded-lg text-xs font-medium transition-colors">
                                今日に追加
                            </button>
                            <button @click="deleteRoutine(routine.id)" class="text-slate-500 hover:text-red-400 p-1">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Modal 2: 1ヶ月まとめ (Monthly Summary Calendar & Stats) -->
    <div x-show="activeModal === 'monthly'" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md"
         style="display: none;">
        
        <div @click.away="activeModal = null" class="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 shadow-2xl flex flex-col gap-6 max-h-[90vh] overflow-y-auto">
            
            <!-- Modal Header & Month Switcher -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <div class="flex items-center gap-2.5">
                    <div class="p-2 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                        <i data-lucide="calendar" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-lg text-white">月間サマリー & カレンダー</h3>
                        <p class="text-xs text-slate-400">月ごとの達成度とタスク履歴の確認</p>
                    </div>
                </div>
                <button @click="activeModal = null" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Month Navigator -->
            <div class="flex items-center justify-between bg-slate-800/50 p-3 rounded-2xl border border-slate-700/50">
                <button @click="changeSummaryMonth(-1)" class="p-1.5 rounded-lg hover:bg-slate-700 text-slate-300">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                
                <span class="font-bold text-base text-slate-100" x-text="summaryMonthDisplay"></span>
                
                <button @click="changeSummaryMonth(1)" class="p-1.5 rounded-lg hover:bg-slate-700 text-slate-300">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Monthly Metrics Cards -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-slate-800/40 border border-slate-800 p-3.5 rounded-2xl flex flex-col items-center justify-center text-center">
                    <span class="text-2xl font-extrabold text-white" x-text="monthlyStats.total"></span>
                    <span class="text-[11px] font-medium text-slate-400 mt-0.5">総タスク数</span>
                </div>
                <div class="bg-slate-800/40 border border-slate-800 p-3.5 rounded-2xl flex flex-col items-center justify-center text-center">
                    <span class="text-2xl font-extrabold text-emerald-400" x-text="monthlyStats.completed"></span>
                    <span class="text-[11px] font-medium text-slate-400 mt-0.5">完了タスク</span>
                </div>
                <div class="bg-slate-800/40 border border-slate-800 p-3.5 rounded-2xl flex flex-col items-center justify-center text-center">
                    <span class="text-2xl font-extrabold text-brand-400" x-text="`${monthlyStats.rate}%`"></span>
                    <span class="text-[11px] font-medium text-slate-400 mt-0.5">月間達成率</span>
                </div>
            </div>

            <!-- Calendar Grid Representation -->
            <div class="flex flex-col gap-2">
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-500 mb-1">
                    <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
                </div>
                
                <div class="grid grid-cols-7 gap-1.5">
                    <!-- Blank padding days -->
                    <template x-for="pad in calendarPaddingDays" :key="'pad-'+pad">
                        <div class="h-14 rounded-xl bg-slate-950/40 border border-transparent"></div>
                    </template>

                    <!-- Month Days -->
                    <template x-for="dayObj in calendarDays" :key="dayObj.dateStr">
                        <div @click="selectDateFromCalendar(dayObj.dateStr)" 
                             class="h-14 rounded-xl border p-1 flex flex-col justify-between cursor-pointer transition-all hover:scale-[1.02]"
                             :class="{
                                 'bg-slate-800/90 border-brand-500 ring-2 ring-brand-500/30': dayObj.dateStr === selectedDate,
                                 'bg-slate-800/30 border-slate-800 hover:border-slate-700': dayObj.dateStr !== selectedDate && dayObj.total > 0,
                                 'bg-slate-900/20 border-slate-800/40 opacity-40': dayObj.total === 0
                             }">
                            
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold" 
                                      :class="dayObj.isToday ? 'text-brand-400' : 'text-slate-300'" 
                                      x-text="dayObj.dayNum"></span>
                                <template x-if="dayObj.hasImage">
                                    <i data-lucide="image" class="w-3 h-3 text-brand-400"></i>
                                </template>
                            </div>

                            <!-- Indicator dot or progress text -->
                            <template x-if="dayObj.total > 0">
                                <div class="w-full flex flex-col gap-0.5">
                                    <div class="text-[9px] text-slate-400 font-medium text-right" x-text="`${dayObj.completed}/${dayObj.total}`"></div>
                                    <div class="w-full bg-slate-700 h-1 rounded-full overflow-hidden">
                                        <div class="bg-brand-500 h-full rounded-full" :style="`width: ${(dayObj.completed / dayObj.total) * 100}%`"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>

            <p class="text-xs text-center text-slate-500">日付をクリックすると、その日のTo-Do一覧へジャンプします</p>
        </div>
    </div>

    <!-- Lightbox Modal for enlarged image preview -->
    <div x-show="lightboxImage" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="lightboxImage = null" 
         class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 cursor-zoom-out"
         style="display: none;">
        
        <img :src="lightboxImage" class="max-w-full max-h-[90vh] object-contain rounded-2xl shadow-2xl border border-slate-800">
    </div>

    <script src="app.js"></script>
</body>
</html>
